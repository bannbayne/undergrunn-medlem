<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <script>
      try {
        if (localStorage.getItem("6ix-theme") === "light") {
          document.documentElement.classList.remove("dark-theme");
        } else {
          document.documentElement.classList.add("dark-theme");
        }
      } catch(e) {}

    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          document.body.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Segoe UI,sans-serif;color:#fff;text-align:center;padding:20px;background:#1e2638;">
              <h1 style="color:#e74c3c;margin-bottom:12px;font-size:28px;">⚠️ Start spillet via Launcheren</h1>
              <p style="font-size:16px;max-width:550px;line-height:1.6;color:#dcdcdc;">
                Nettlesere tillater ikke spillmoduler når du åpner HTML-filen direkte med <code>file://</code>.<br><br>
                For å spille uten problemer:<br>
                👉 <b>Dobbeltklikk på <code>Play_Game.bat</code></b> eller <b><code>Start_Launcher.bat</code></b> i denne mappen!

    </script>
    <script type="module" crossorigin src="./assets/index-offline.js?v=1794465720788"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Be8o02GI.css?v=1794465720788">
  </head>
  <body>
    <script>
      try {
        if (localStorage.getItem("6ix-theme") === "light") {
          document.body.classList.remove("dark-theme");
          document.documentElement.classList.remove("dark-theme");
        } else {
          document.body.classList.add("dark-theme");
          document.documentElement.classList.add("dark-theme");
        }
      } catch(e) {}
    </script>
