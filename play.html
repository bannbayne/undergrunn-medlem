<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      /* Gjor det vanskeligere a snoke i koden (stopper ikke alt: nettleserens
         egen meny og direkte nedlasting av filene kan ikke blokkeres). */
      (function () {
        try {
          // Suppress the browser's native right-click menu (View source / Inspect).
          // The game's own right-click item actions still run, so they keep working.
          document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
          // Block the common DevTools / view-source keyboard shortcuts.
          document.addEventListener("keydown", function (e) {
            var k = (e.key || "").toLowerCase();
            var mod = e.ctrlKey || e.metaKey;
            if (e.key === "F12" ||
                (mod && e.shiftKey && (k === "i" || k === "j" || k === "c")) ||
                (mod && k === "u")) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }, true);
        } catch (_e) {}
      })();
    </script>
    <script>
      try {
        if (localStorage.getItem("6ix-theme") === "light") {
          document.documentElement.classList.remove("dark-theme");
        } else {
          document.documentElement.classList.add("dark-theme");
        }
      } catch(e) {}
    </script>

    <title>Medlem</title>
    <link rel="icon" type="image/png" href="./favicon.png?v=1794565808319" />
    <link rel="shortcut icon" href="./favicon.ico?v=1794565808319" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=1794565808319" />
    <script>
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          document.body.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:Segoe UI,sans-serif;color:#fff;text-align:center;padding:20px;background:#1e2638;">
              <h1 style="color:#e74c3c;margin-bottom:12px;font-size:28px;">⚠️ Start spillet via Launcheren</h1>
              <p style="font-size:16px;max-width:550px;line-height:1.6;color:#dcdcdc;">
                Nettlesere tillater ikke spillmoduler når du åpner HTML-filen direkte med <code>file://</code>.<br><br>
                For å spille uten problemer:<br>
                👉 <b>Dobbeltklikk på <code>Play_Game.bat</code></b> eller <b><code>Start_Launcher.bat</code></b> i denne mappen!
              </p>
            </div>
          `;
        });
      }
    </script>
    <script type="module" crossorigin src="./assets/index-offline.js?v=1794829392623"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Be8o02GI.css?v=1794829392623">
      <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (let reg of regs) { reg.unregister(); }
        });
      }
    </script>
  </head>
  <body>
    <script>
      try {
        if (localStorage.getItem("6ix-theme") === "light") {
          document.body.classList.remove("dark-theme");
          document.documentElement.classList.remove("dark-theme");
        } else {
          document.body.classList.add("dark-theme");
          document.documentElement.classList.add("dark-theme");
        }
      } catch(e) {}
    </script>
    <div id="app">
      <div id="boot-splash" aria-hidden="true">
        <div class="boot-brand">MEDLEM</div>
        <div class="boot-spinner"></div>
        <div id="boot-msg">Laster inn&nbsp;…</div>
        <button id="boot-reload" type="button" onclick="location.reload()">Last inn på nytt</button>
      </div>
    </div>
    <style id="boot-splash-style">
      #boot-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:16px;background:#0b0d12;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e8eaf0;
        -webkit-user-select:none;user-select:none;}
      #boot-splash .boot-brand{font-weight:800;letter-spacing:.35em;font-size:22px;
        padding-left:.35em;color:#fff;opacity:.92;}
      #boot-splash .boot-spinner{width:34px;height:34px;border-radius:50%;
        border:3px solid rgba(255,255,255,.18);border-top-color:#e23b3b;
        animation:boot-spin .9s linear infinite;}
      @keyframes boot-spin{to{transform:rotate(360deg);}}
      #boot-splash #boot-msg{font-size:13px;opacity:.7;text-align:center;padding:0 24px;}
      #boot-splash #boot-reload{display:none;margin-top:6px;padding:10px 20px;border:0;
        border-radius:10px;background:#e23b3b;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
    </style>
    <script>
      (function(){
        var start=Date.now();
        function mounted(){
          var app=document.getElementById('app');
          if(!app)return true;
          for(var i=0;i<app.children.length;i++){
            if(app.children[i].id!=='boot-splash')return true;
          }
          return false;
        }
        function fail(txt){
          var m=document.getElementById('boot-msg'),b=document.getElementById('boot-reload');
          if(m)m.textContent=txt;
          if(b)b.style.display='';
        }
        var iv=setInterval(function(){
          if(mounted()){
            var s=document.getElementById('boot-splash');
            if(s)s.remove();
            clearInterval(iv);
            return;
          }
          if(Date.now()-start>22000)fail('Serveren starter opp – dette kan ta et minutt. Trykk under for å prøve igjen.');
        },350);
        window.addEventListener('error',function(e){
          if(e&&e.target&&e.target.tagName==='SCRIPT'&&!mounted()){
            fail('Kunne ikke laste spillet. Prøv igjen.');
          }
        },true);
      })();
    </script>
  </body>
</html>
