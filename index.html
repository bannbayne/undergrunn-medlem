    <script>
      /* Gjor det vanskeligere a snoke i koden (stopper ikke alt: nettleserens
         egen meny og direkte nedlasting av filene kan ikke blokkeres). */
      (function () {
        try {
          // Suppress the browser's native right-click menu (View source / Inspect).
          // The game's own right-click item actions still run, so they keep working.
          document.addEventListener("contextmenu", function (e) { e.preventDefault(); }, true);
          // Block the common DevTools / view-source keyboard shortcuts.
          document.addEventListener("keydown", function (e) {
            var k = (e.key || "").toLowerCase();
            var mod = e.ctrlKey || e.metaKey;
            if (e.key === "F12" ||
                (mod && e.shiftKey && (k === "i" || k === "j" || k === "c")) ||
                (mod && k === "u")) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }, true);
        } catch (_e) {}
      })();
    </script>
    <script>
      try {
        if (localStorage.getItem("6ix-theme") === "light") {
          document.documentElement.classList.remove("dark-theme");
        } else {
          document.documentElement.classList.add("dark-theme");
        }
      } catch(e) {}
    </script>

    <script id="medlem-account-reset">
      /* Kontonullstilling: nar denne token endres, logges alle ut lokalt og ma
         lage ny bruker ved neste lasting. Rommene (room-meta/room-furni) beholdes.
         Hold token lik ACCOUNT_RESET_TOKEN i server.py. */
      (function () {
        try {
          var TOKEN = "reset-2026-11-16-a";
          if (localStorage.getItem("6ix-account-reset") !== TOKEN) {
            for (var i = localStorage.length - 1; i >= 0; i--) {
              var k = localStorage.key(i);
              if (!k || k.indexOf("6ix-") !== 0) continue;
              if (/^6ix-(room-meta-|room-furni-|account-reset$|theme$)/.test(k)) continue;
              localStorage.removeItem(k);
            }
            localStorage.setItem("6ix-account-reset", TOKEN);
          }
        } catch (e) {}
      })();
    </script>

    <script>
      try {
        if (localStorage.getItem("6ix-theme") === "light") {
          document.body.classList.remove("dark-theme");
          document.documentElement.classList.remove("dark-theme");
        } else {
          document.body.classList.add("dark-theme");
          document.documentElement.classList.add("dark-theme");
        }
      } catch(e) {}
    </script>
    <div id="app">

          <span class="boot-word">Medlem</span>

        <div class="boot-spin" aria-hidden="true"><i style="transform:rotate(0deg);animation-delay:-1.00s"></i><i style="transform:rotate(30deg);animation-delay:-0.92s"></i><i style="transform:rotate(60deg);animation-delay:-0.83s"></i><i style="transform:rotate(90deg);animation-delay:-0.75s"></i><i style="transform:rotate(120deg);animation-delay:-0.67s"></i><i style="transform:rotate(150deg);animation-delay:-0.58s"></i><i style="transform:rotate(180deg);animation-delay:-0.50s"></i><i style="transform:rotate(210deg);animation-delay:-0.42s"></i><i style="transform:rotate(240deg);animation-delay:-0.33s"></i><i style="transform:rotate(270deg);animation-delay:-0.25s"></i><i style="transform:rotate(300deg);animation-delay:-0.17s"></i><i style="transform:rotate(330deg);animation-delay:-0.08s"></i></div>

    <style id="boot-splash-style">
      #boot-splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
        align-items:center;justify-content:center;gap:24px;background:#000;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;
        -webkit-user-select:none;user-select:none;}
      #boot-splash .boot-logo{display:flex;flex-direction:column;align-items:center;gap:12px;}
      #boot-splash .boot-logo svg{image-rendering:pixelated;}
      #boot-splash .boot-word{font-weight:700;font-size:20px;letter-spacing:.01em;color:#fff;}
      #boot-splash .boot-spin{width:34px;height:34px;position:relative;}
      #boot-splash .boot-spin i{position:absolute;left:15px;top:0;width:4px;height:10px;
        border-radius:2px;background:#fff;transform-origin:2px 17px;opacity:.15;
        animation:boot-sp 1s linear infinite;}
      @keyframes boot-sp{0%{opacity:1}100%{opacity:.15}}
      #boot-splash #boot-msg{font-size:13px;opacity:.65;text-align:center;padding:0 24px;}
      #boot-splash #boot-reload{display:none;margin-top:4px;padding:10px 20px;border:0;
        border-radius:10px;background:#d32121;color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
    </style>
    <script>
      (function(){
        var start=Date.now();
        function mounted(){
          var app=document.getElementById('app');
          if(!app)return true;
          for(var i=0;i<app.children.length;i++){
            if(app.children[i].id!=='boot-splash')return true;
          }
          return false;
        }
        function fail(txt){
          var m=document.getElementById('boot-msg'),b=document.getElementById('boot-reload');
          if(m)m.textContent=txt;
          if(b)b.style.display='';
        }
        var iv=setInterval(function(){
          if(mounted()){
            var s=document.getElementById('boot-splash');
            if(s)s.remove();
            clearInterval(iv);
            return;
          }
          if(Date.now()-start>22000)fail('Serveren starter opp – dette kan ta et minutt. Trykk under for å prøve igjen.');
        },350);
        window.addEventListener('error',function(e){
          if(e&&e.target&&e.target.tagName==='SCRIPT'&&!mounted()){
            fail('Kunne ikke laste spillet. Prøv igjen.');
          }
        },true);
      })();
    </script>
    <script id="medlem-room-sync">
      /* Medlem rom-synk: publiser eget rom (full meta) til delt katalog (roomsMeta)
         slik at andre kan soke det opp og se samme farger/stoerrelse. Moeblene synkes
         via world-state. Bruker spillets egne window.__-kroker; roerer ikke spill-logikken. */
      (function () {
        function cu() { try { return JSON.parse(localStorage.getItem("6ix-current-user") || "null"); } catch (e) { return null; } }
        function myUid() { var u = cu(); return (u && u.uid) || null; }
        function net() { return window.__medlemNet; }
        function readMeta(rid) { try { return JSON.parse(localStorage.getItem("6ix-room-meta-" + rid) || "null"); } catch (e) { return null; } }

        function publishMine() {
          try {
            var n = net(), me = myUid();
            if (!n || !me) return;
            var rid = "u_" + me;
            var meta = readMeta(rid);
            if (!meta || typeof meta !== "object") return;   // only publish a real saved room
            var u = cu(), entry = {};
            for (var k in meta) entry[k] = meta[k];          // full meta (theme, w, h, access, ...)
            entry.owner = me;
            entry.ownerName = meta.ownerName || (u && u.name) || "";
            if (!entry.name) entry.name = ((u && u.name) || "") + "s rom";
            if (!entry.access) entry.access = "open";
            n.set("roomsMeta/" + rid, entry);
          } catch (e) {}
        }

        function mirror(all) {
          try {
            if (!all || typeof all !== "object") return;
            var me = myUid();
            for (var rid in all) {
              if (rid.indexOf("u_") !== 0) continue;
              var m = all[rid];
              if (!m || typeof m !== "object" || !m.theme) continue;  // require a real meta
              if (m.owner === me) continue;                           // keep my own local meta
              var cur = readMeta(rid) || {}, merged = {};
              for (var a in cur) merged[a] = cur[a];
              for (var b in m) merged[b] = m[b];                      // server wins
              try { localStorage.setItem("6ix-room-meta-" + rid, JSON.stringify(merged)); } catch (e) {}
            }
          } catch (e) {}
        }

        function start() {
          var n = net();
          if (!n) { setTimeout(start, 800); return; }
          try { n.onValue("roomsMeta", function (snap) { mirror(snap && snap.val && snap.val() || {}); }); } catch (e) {}
          setTimeout(publishMine, 3000);
          setInterval(publishMine, 8000);
        }
        if (document.readyState === "complete" || document.readyState === "interactive") start();
        else window.addEventListener("DOMContentLoaded", start);
      })();
    </script>
  </body>
